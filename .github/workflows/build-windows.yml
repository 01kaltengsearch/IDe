name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js (build machine only)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WebForge-IDE-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
